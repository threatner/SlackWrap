[project]
name = "slackwrap"
version = "2.0.0"
description = "Your Slack year in review — huddle and message analytics"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "textual>=0.50.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.24.0",
]

[project.scripts]
slackwrap = "slackwrap.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
